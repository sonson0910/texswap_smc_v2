services:
  proof-server:
    image: 'midnightntwrk/proof-server:7.0.0'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
      RAYON_NUM_THREADS: '8'
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
